name: CI

on:
  push:
    branches: [master]
    tags:
      - v*

  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_BACKTRACE: full
  SOLC_VERSION: v0.8.30
  FOUNDRY_VERSION: v1.5.1

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Generate tree-sitter parser
        working-directory: crates/tree-sitter-fe
        run: |
          # Install only the pinned tree-sitter CLI (skip the root package's
          # Node-addon build, which the Rust build doesn't use), then generate
          # parser.c and friends from grammar.js.
          npm ci --ignore-scripts
          npm rebuild tree-sitter-cli
          npx tree-sitter generate --abi=14
      - name: Cache Dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Validate release notes entry
        run: ./newsfragments/validate_files.py
      - name: Lint with rustfmt
        run: cargo fmt --all -- --check
      - name: Lint with clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D clippy::all

  test:
    # Build & Test runs on all platforms
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macOS-latest
          - os: windows-latest
    env:
      # MSVC's link.exe is much slower than lld at linking the large test
      # binaries. Only affects Windows builds.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Cache tree-sitter parser
        id: tree-sitter-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            crates/tree-sitter-fe/src/parser.c
            crates/tree-sitter-fe/src/grammar.json
            crates/tree-sitter-fe/src/node-types.json
            crates/tree-sitter-fe/src/tree_sitter
          key: tree-sitter-parser-${{ runner.os }}-${{ hashFiles('crates/tree-sitter-fe/grammar.js', 'crates/tree-sitter-fe/package-lock.json', 'crates/tree-sitter-fe/bindings/rust/build.rs') }}
      - name: Mark cached tree-sitter parser as fresh
        if: steps.tree-sitter-cache.outputs.cache-hit == 'true'
        working-directory: crates/tree-sitter-fe
        shell: bash
        # The checkout makes grammar.js newer than the restored files, which
        # would make the build script try to regenerate them.
        run: touch src/parser.c src/grammar.json src/node-types.json
      - name: Setup Node
        if: steps.tree-sitter-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Generate tree-sitter parser
        if: steps.tree-sitter-cache.outputs.cache-hit != 'true'
        working-directory: crates/tree-sitter-fe
        shell: bash
        run: |
          # Install only the pinned tree-sitter CLI (skip the root package's
          # Node-addon build, which the Rust build doesn't use), then generate
          # parser.c and friends from grammar.js.
          npm ci --ignore-scripts
          npm rebuild tree-sitter-cli
          npx tree-sitter generate --abi=14
      - name: Cache solc
        id: solc-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.os == 'Windows' && format('{0}\\solc-{1}.exe', runner.temp, env.SOLC_VERSION) || format('{0}/solc-{1}', runner.temp, env.SOLC_VERSION) }}
          key: solc-${{ runner.os }}-${{ env.SOLC_VERSION }}
      - name: Download solc (Linux/macOS)
        if: steps.solc-cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Linux" ]; then
            url="https://github.com/ethereum/solidity/releases/download/${SOLC_VERSION}/solc-static-linux"
          else
            url="https://github.com/ethereum/solidity/releases/download/${SOLC_VERSION}/solc-macos"
          fi
          curl -Ls "$url" -o "$RUNNER_TEMP/solc-${SOLC_VERSION}"
          chmod +x "$RUNNER_TEMP/solc-${SOLC_VERSION}"
      - name: Download solc (Windows)
        if: steps.solc-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/ethereum/solidity/releases/download/$env:SOLC_VERSION/solc-windows.exe"
          $output = "$env:RUNNER_TEMP\solc-$env:SOLC_VERSION.exe"
          Invoke-WebRequest -Uri $url -OutFile $output
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@badb8c3638e0b773c6c17a6025c2306a8f1c4303 # nextest
        with:
          tool: nextest
      - name: Cache Dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Build
        run: cargo test --release --workspace --all-features --no-run --locked --exclude fe-bench --timings
      - name: Run tests
        env:
          FE_SOLC_PATH: ${{ runner.os == 'Windows' && format('{0}\\solc-{1}.exe', runner.temp, env.SOLC_VERSION) || format('{0}/solc-{1}', runner.temp, env.SOLC_VERSION) }}
        run: >-
          cargo nextest run --release --workspace --all-features --no-fail-fast --locked --exclude fe-bench
          -E 'not (package(=fe-language-server) and test(/^mock_client_tests::/))'
      - name: Upload build timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-${{ runner.os }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 14

  wasm-wasi-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Install WASM targets
        run: |
          rustup target add wasm32-unknown-unknown
          rustup target add wasm32-wasip1
      - name: Cache Dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Check core crates for wasm32-unknown-unknown
        run: cargo check --locked -p fe-common -p fe-parser -p fe-hir --target wasm32-unknown-unknown
      - name: Check filesystem crates for wasm32-wasip1
        run: cargo check --locked -p fe-driver -p fe-resolver --target wasm32-wasip1

  release-build:
    # Only run this when we push a tag
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    needs: [lint, test, wasm-wasi-check]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            BIN_FILE: fe_linux_amd64
            EXT: ""
            EXTRA_FEATURES: ""
            STRIP: strip
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            BIN_FILE: fe_linux_arm64
            EXT: ""
            EXTRA_FEATURES: ""
            STRIP: aarch64-linux-gnu-strip
          - os: macOS-latest
            target: aarch64-apple-darwin
            BIN_FILE: fe_mac_arm64
            EXT: ""
            EXTRA_FEATURES: ""
            STRIP: strip
          - os: macOS-latest
            target: x86_64-apple-darwin
            BIN_FILE: fe_mac_amd64
            EXT: ""
            EXTRA_FEATURES: ""
            STRIP: strip
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            BIN_FILE: fe_windows_amd64.exe
            EXT: ".exe"
            EXTRA_FEATURES: ""
            STRIP: ""

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cross-compilation toolchain (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Install rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Generate tree-sitter parser
        working-directory: crates/tree-sitter-fe
        shell: bash
        run: |
          # Install the pinned CLI without building the unused Node addon.
          npm ci --ignore-scripts
          npm rebuild tree-sitter-cli
          npx tree-sitter generate --abi=14
      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --locked --release --target ${{ matrix.target }} ${{ matrix.EXTRA_FEATURES }}
      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        run: ${{ matrix.STRIP }} target/${{ matrix.target }}/release/fe
      - name: Rename binary
        shell: bash
        run: mv target/${{ matrix.target }}/release/fe${{ matrix.EXT }} target/${{ matrix.target }}/release/${{ matrix.BIN_FILE }}
      - name: Upload release binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fe-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.BIN_FILE }}
          if-no-files-found: error
          retention-days: 1

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [release-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download release binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: fe-*
          merge-multiple: true
          path: dist
      - name: Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          prerelease: true

  docs-generate:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [release]
    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Docs deployment requires a stable version tag" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download fe binary from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern 'fe_linux_amd64' --dir /tmp
          chmod +x /tmp/fe_linux_amd64

      - name: Generate documentation
        run: |
          mkdir -p /tmp/docs-out
          timeout 300 /tmp/fe_linux_amd64 doc --builtins -o /tmp/docs-out json
          /tmp/fe_linux_amd64 doc -o /tmp/docs-out bundle --with-css
          python3 -c "
          import json, sys
          with open('/tmp/docs-out/docs.json') as f:
            d = json.load(f)
          sv = d.get('schema_version')
          cv = d.get('compiler_version')
          if not sv or not cv:
            print(f'ERROR: missing schema_version={sv} or compiler_version={cv}', file=sys.stderr)
            sys.exit(1)
          print(f'docs.json: schema v{sv}, compiler v{cv}, {len(d[\"index\"][\"items\"])} items')
          "

      - name: Upload generated docs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs
          path: |
            /tmp/docs-out/docs.json
            /tmp/docs-out/fe-web.js
            /tmp/docs-out/fe-highlight.css
            /tmp/docs-out/styles.css
          if-no-files-found: error
          retention-days: 1

  docs:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')
    needs: [docs-generate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: fe-docs-deploy
    steps:
      - name: Download generated docs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docs
          path: /tmp/docs-out
      - name: Validate generated docs
        run: |
          set -euo pipefail
          test -d /tmp/docs-out && test ! -L /tmp/docs-out
          for name in docs.json fe-web.js fe-highlight.css styles.css; do
            file="/tmp/docs-out/$name"
            test -f "$file" && test ! -L "$file"
          done

      - name: Deploy to doc site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fe-lang/fe-docs
          token: ${{ secrets.DOC_DEPLOY_TOKEN }}
          path: fe-docs
          ref: main

      - name: Deploy docs
        run: |
          cd fe-docs
          make deploy VERSION="${GITHUB_REF_NAME#v}" OUTDIR=/tmp/docs-out

      - name: Push doc site
        run: |
          cd fe-docs
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add versions.json fe-web.js fe-highlight.css styles.css "${GITHUB_REF_NAME#v}/"
          if git diff-index --quiet HEAD; then
            echo "No changes to deploy"
            exit 0
          fi
          git commit -m "Deploy docs for $GITHUB_REF_NAME"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push failed (attempt $attempt), rebasing..."
            git pull --rebase
          done
          echo "ERROR: Failed to push after 3 attempts" >&2
          exit 1
