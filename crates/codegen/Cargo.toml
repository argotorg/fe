[package]
name = "fe-codegen"
version = "26.5.0"
edition.workspace = true

[features]
cranelift = ["dep:sonatina-cranelift"]
sp1 = ["cranelift", "sonatina-cranelift/sp1"]

[dependencies]
driver = { path = "../driver", package = "fe-driver" }
mir = { path = "../mir", package = "fe-mir" }
hir.workspace = true
common.workspace = true
trace-facts.workspace = true
blake3.workspace = true
hex = "0.4"
num-bigint.workspace = true
rayon = "1"
ruint.workspace = true
rustc-hash.workspace = true
sonatina-ir.workspace = true
sonatina-triple.workspace = true
sonatina-codegen.workspace = true
sonatina-cranelift = { workspace = true, optional = true }
sonatina-verifier.workspace = true
smallvec.workspace = true
smallvec1.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing.workspace = true

[dev-dependencies]
contract-harness = { path = "../contract-harness", package = "fe-contract-harness" }
dir-test.workspace = true
salsa.workspace = true
test-utils.workspace = true
url.workspace = true
hir = { workspace = true, features = ["testutils"] }
