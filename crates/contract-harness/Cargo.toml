[package]
name = "fe-contract-harness"
version = "26.4.0"
edition.workspace = true

[dependencies]
driver = { path = "../driver", package = "fe-driver" }
codegen = { path = "../codegen", package = "fe-codegen" }
common = { path = "../common", package = "fe-common" }
revm = { version = "33.1.0", default-features = false, features = ["std"] }
hex = "0.4"
url.workspace = true
ethers-core = "2"
thiserror = "1"
tracing.workspace = true
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
